<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- CSS CLEAN & RESPONSIVE --- */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; }

        .sinta-header {
            background-color: #002147;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            position: sticky;
            top: 0;
            z-index: 9999;
            height: 60px;
        }

        .sinta-logo-area { display: flex; align-items: center; gap: 10px; }
        .sinta-logo-circle {
            width: 35px; height: 35px; background: white; border-radius: 50%;
            color: #002147; display: flex; align-items: center; justify-content: center;
            font-weight: bold; border: 2px solid #ffcc00;
        }

        /* Navigasi Laptop */
        .sinta-nav { display: flex; gap: 20px; }
        .sinta-nav a {
            color: white; text-decoration: none; font-weight: 600;
            font-size: 13px; text-transform: uppercase;
        }

        /* Hamburger (Sembunyi di Laptop) */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 5px;
        }
        .hamburger span { width: 25px; height: 3px; background: white; border-radius: 2px; }

        /* --- PENGATURAN OTOMATIS HP (Max 768px) --- */
        @media screen and (max-width: 768px) {
            .sinta-header { padding: 10px 20px; }

            .hamburger { display: flex; } /* Munculkan garis tiga */

            .sinta-nav {
                display: none; /* Sembunyikan menu bawaan */
                flex-direction: column;
                position: absolute;
                top: 60px; /* Pas di bawah header */
                left: 0;
                width: 100%;
                background-color: #002147;
                padding: 10px 0;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }

            /* Saat tombol diklik, JS akan menambah class ini */
            .sinta-nav.active {
                display: flex !important;
            }

            .sinta-nav a {
                padding: 15px;
                text-align: center;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                display: block;
            }
        }
    </style>
</head>
<body>

<header class="sinta-header">
    <div class="sinta-logo-area">
        <div class="sinta-logo-circle">FJK</div>
        <div style="line-height: 1.2;">
            <div style="font-weight: bold; font-size: 16px;">FJK Research Gate</div>
            <div style="font-size: 10px; color: #ffcc00;">AUTHORS DIRECTORY</div>
        </div>
    </div>

    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="sinta-nav" id="mainNav">
        <a href="index.html">Beranda</a>
        <a href="authors.html">Author</a>
        <a href="affiliations.html" style="color: #ffcc00;">Affiliations</a>
        <a href="#">Registration</a>
    </nav>
</header>

<div style="padding: 20px; text-align: center;">
    <h2>Konten Website</h2>
    <p>Coba kecilkan jendela browser kamu atau buka lewat HP untuk melihat menu berubah jadi garis tiga.</p>
</div>

<script>
    function toggleMenu() {
        var menu = document.getElementById("mainNav");
        // Logika: Jika ada class 'active' hapus, jika tidak ada tambahkan.
        menu.classList.toggle("active");
    }
</script>

</body>
</html>
